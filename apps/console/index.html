<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PRC V2.5 · WorkStage Spatial Map — Living Drawer</title>
<style>
  /* ─── tokens — tech/utility direction, bound verbatim ──────────────── */
  :root {
    --bg:      oklch(98% 0.005 250);
    --surface: oklch(100% 0 0);
    --fg:      oklch(22% 0.02 240);
    --muted:   oklch(50% 0.018 240);
    --border:  oklch(90% 0.008 240);
    --accent:  oklch(58% 0.16 145);

    --font-display: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
    --font-body:    -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
    --font-mono:    'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;

    /* semantic layer — one hue per meaning, never decoration */
    --c-current:  var(--accent);              /* 当前阶段 */
    --c-done:     oklch(56% 0.045 250);       /* 已完成 / 中性 */
    --c-parallel: oklch(56% 0.125 292);       /* 并行分支 / Research */
    --c-shift:    oklch(63% 0.115 68);        /* 方向修正 */
    --c-evidence: oklch(55% 0.115 250);       /* 证据 / 追索 */
    --c-unknown:  oklch(64% 0.012 250);       /* 未解析 */

    /* inks — same hues pulled toward --fg so small text clears 4.5:1 */
    --ink-current:  color-mix(in oklch, var(--c-current) 62%, var(--fg));
    --ink-done:     color-mix(in oklch, var(--c-done) 62%, var(--fg));
    --ink-parallel: color-mix(in oklch, var(--c-parallel) 62%, var(--fg));
    --ink-shift:    color-mix(in oklch, var(--c-shift) 66%, var(--fg));
    --ink-evidence: color-mix(in oklch, var(--c-evidence) 62%, var(--fg));

    --muted-ink:     color-mix(in oklch, var(--muted) 82%, var(--fg));
    --border-strong: color-mix(in oklch, var(--fg) 24%, var(--border));
    --hairline:      color-mix(in oklch, var(--fg) 10%, var(--border));
    --fg-soft:       color-mix(in oklch, var(--fg) 5%, var(--surface));
    --flat:          color-mix(in oklch, var(--bg) 76%, var(--surface));

    /* surfaces carry depth with layered shadow instead of a hairline box.
       Pure-black rings (not a tinted neutral) so they sit correctly on any
       background tone — the canvas is a gradient, a solid border is not. */
    --edge:          inset 0 0 0 1px oklch(0 0 0 / 0.055),
                     0 1px 2px -1px oklch(0 0 0 / 0.05),
                     0 2px 6px -1px oklch(0 0 0 / 0.04);
    --edge-hover:    inset 0 0 0 1px oklch(0 0 0 / 0.075),
                     0 2px 4px -1px oklch(0 0 0 / 0.07),
                     0 8px 18px -6px oklch(0 0 0 / 0.07);
    --edge-recessed: inset 0 0 0 1px oklch(0 0 0 / 0.045);

    --lift-1: 0 1px 1px color-mix(in oklch, var(--fg) 5%, transparent),
              0 4px 10px -4px color-mix(in oklch, var(--fg) 10%, transparent);
    --lift-2: 0 1px 1px color-mix(in oklch, var(--fg) 6%, transparent),
              0 10px 22px -8px color-mix(in oklch, var(--fg) 16%, transparent),
              0 26px 50px -30px color-mix(in oklch, var(--fg) 22%, transparent);
    --lift-3: 0 1px 2px color-mix(in oklch, var(--fg) 8%, transparent),
              0 24px 60px -16px color-mix(in oklch, var(--fg) 20%, transparent),
              0 60px 120px -60px color-mix(in oklch, var(--fg) 28%, transparent);

    --ease-out:    cubic-bezier(.22, 1, .36, 1);
    --ease-spring: cubic-bezier(.34, 1.38, .64, 1);
    --t-fast: 150ms;
    --t-base: 260ms;
    --t-slow: 420ms;

    --dock-w: 400px;
    --topbar-h: 52px;
    --status-h: 44px;
    --r: 8px;
    --r-lg: 12px;
    --r-xl: 16px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; height: 100%; }
  body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
  /* wrapping — headings balance, short body text avoids a dangling last line */
  p, li { text-wrap: pretty; }
  h1, h2, h3 { text-wrap: balance; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ─── shell ───────────────────────────────────────────────────────── */
  .console { height: 100%; display: grid; grid-template-rows: var(--topbar-h) minmax(0,1fr) var(--status-h); }

  .topbar {
    display: flex; align-items: center; gap: 16px; padding-inline: 18px;
    background: color-mix(in oklch, var(--surface) 86%, transparent);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border); min-width: 0; z-index: 20;
  }
  .brand { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
  .brand .mark {
    font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .06em;
    color: var(--fg); border: 1px solid var(--border-strong); border-radius: 5px; padding: 2px 5px;
  }
  .brand .name { font-family: var(--font-display); font-size: 14.5px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
  .runid {
    font-family: var(--font-mono); font-size: 11.5px; color: var(--muted-ink);
    padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px; white-space: nowrap;
  }
  .topbar .spacer { flex: 1 1 auto; min-width: 8px; }
  .nowstage {
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    font-family: var(--font-mono); font-size: 11px; color: var(--muted-ink);
    padding: 4px 10px 4px 8px; border: 1px solid var(--border); border-radius: 999px;
  }
  .nowstage b { color: var(--ink-current); font-weight: 600; }
  .ghostbtn {
    position: relative;
    display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px;
    border-radius: var(--r); border: 1px solid var(--border); color: var(--muted-ink); font-size: 12.5px; white-space: nowrap;
    transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast), box-shadow var(--t-fast), scale var(--t-fast) var(--ease-out);
  }
  .ghostbtn:active { scale: .96; }
  .ghostbtn::after { content: ''; position: absolute; inset: -3px -2px; }
  .ghostbtn:hover { border-color: var(--border-strong); color: var(--fg); background: var(--fg-soft); box-shadow: var(--lift-1); }
  .ghostbtn[disabled] { opacity: .4; cursor: default; }
  .ghostbtn[disabled]:hover { border-color: var(--border); background: none; color: var(--muted-ink); box-shadow: none; }

  .stage { position: relative; min-height: 0; }

  /* ─── canvas: one quiet field under the floating drawer ───────────── */
  /* A single lighting model, not a stack of effects: key light from the
     upper-left (the same direction every card shadow falls), ambient
     fall-off toward the lower edge. No pattern, no vignette, no glow. */
  .canvas {
    position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
    background:
      radial-gradient(126% 84% at 24% -10%,
        color-mix(in oklch, var(--surface) 66%, var(--bg)) 0%,
        color-mix(in oklch, var(--surface) 20%, var(--bg)) 44%,
        transparent 76%),
      linear-gradient(179deg,
        var(--bg) 0%,
        color-mix(in oklch, var(--surface) 20%, var(--bg)) 32%,
        color-mix(in oklch, var(--fg) 3.4%, var(--bg)) 100%);
  }
  .canvas.is-panning { cursor: grabbing; }

  .world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }

  .edges { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
  .edges path { fill: none; stroke: var(--hairline); stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-linecap: round; }
  .edges path.seg-near { stroke: var(--border-strong); }
  .edges path.prog { stroke: var(--c-current); stroke-width: 2; opacity: 0; transition: stroke-dashoffset var(--t-slow) var(--ease-out), opacity var(--t-base) ease; }
  .edges path.flow {
    stroke: var(--c-current); stroke-width: 2.5; opacity: .34; stroke-dasharray: 1 13;
    animation: flow 3.4s linear infinite;
  }
  @keyframes flow { to { stroke-dashoffset: -56; } }

  /* stop markers on the spine */
  .stop {
    position: absolute; width: 20px; height: 20px; border-radius: 50%; pointer-events: none;
    display: grid; place-items: center; z-index: 2;
    background: var(--surface); border: 1px solid var(--border-strong);
    font-family: var(--font-mono); font-size: 10px; color: var(--muted-ink);
    box-shadow: 0 1px 2px color-mix(in oklch, var(--fg) 8%, transparent);
    transition: background var(--t-base) var(--ease-out), border-color var(--t-base), color var(--t-base),
                box-shadow var(--t-base), transform var(--t-base) var(--ease-out);
  }
  .stop.is-sel { background: var(--fg); border-color: var(--fg); color: var(--bg); transform: scale(1.12); }
  .stop.is-cur { border-color: var(--c-current); color: var(--ink-current); }
  .stop.is-cur::after {
    content: ''; position: absolute; inset: -5px; border-radius: 50%;
    border: 1px solid var(--c-current); opacity: 0; animation: breathe 3.6s var(--ease-out) infinite;
  }
  @keyframes breathe { 0%, 100% { opacity: 0; transform: scale(.82); } 45% { opacity: .5; transform: scale(1); } }
  .stop.is-sel.is-cur { color: var(--bg); }

  /* ─── nodes ───────────────────────────────────────────────────────── */
  .node { position: absolute; display: block; background: none; border: 0; padding: 0; color: var(--fg); z-index: 3; }
  .node .n-glow {
    position: absolute; inset: -34px; z-index: 0; border-radius: 26px; opacity: 0;
    background: radial-gradient(closest-side, color-mix(in oklch, var(--node-c, var(--c-done)) 20%, transparent), transparent 100%);
    transition: opacity var(--t-slow) ease;
  }
  .node .n-stack {
    position: absolute; inset: 0; z-index: 1; border-radius: var(--r-lg);
    box-shadow: inset 0 0 0 1px var(--hairline); background: color-mix(in oklch, var(--surface) 55%, var(--bg));
    transform: translate(9px, 9px);
    transition: transform var(--t-base) var(--ease-out), box-shadow var(--t-base), background var(--t-base);
  }
  .node .n-stack.b { transform: translate(5px, 5px); z-index: 2; background: color-mix(in oklch, var(--surface) 78%, var(--bg)); }
  .node .n-body {
    position: relative; z-index: 3; display: block; width: 100%; height: 100%;
    padding: 12px 14px; border-radius: var(--r-lg); overflow: hidden;
    background: var(--surface);
    box-shadow: var(--edge);
    transition: transform var(--t-base) var(--ease-out), box-shadow var(--t-base) var(--ease-out),
                background var(--t-base), opacity var(--t-base);
  }
  .node .n-name {
    display: block; font-family: var(--font-display); font-size: 14.5px; font-weight: 600;
    line-height: 17px; letter-spacing: -.008em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .node .n-out {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    margin-top: 4px; font-size: 12px; line-height: 16.2px; min-height: 32px; color: var(--muted-ink);
  }
  .node .n-status {
    display: flex; align-items: center; gap: 7px; margin-top: 5px; line-height: 1;
    font-family: var(--font-mono); font-size: 11px; color: var(--muted-ink);
  }
  /* glyph shape carries the type too, so the system never depends on hue alone */
  .glyph { width: 7px; height: 7px; border-radius: 50%; background: var(--c-done); flex: 0 0 auto; }
  .glyph.current { background: var(--c-current); }
  .glyph.parallel { background: none; border-radius: 1px; box-shadow: 0 0 0 1px var(--c-parallel) inset; }
  .glyph.shift { border-radius: 1px; transform: rotate(45deg); background: var(--c-shift); }
  .glyph.unknown { background: none; border: 1px dashed var(--c-unknown); width: 8px; height: 8px; }

  /* hover — a small lift, never a colour change on text */
  .node:hover .n-body { transform: translateY(-3px); box-shadow: var(--edge-hover), var(--lift-2); }
  .node:hover .n-glow { opacity: .85; }
  .node:hover .n-stack { transform: translate(11px, 11px); }
  .node:hover .n-stack.b { transform: translate(6px, 6px); }

  /* selected — scale + halo + lift; text colour is untouched */
  .node.is-sel { z-index: 6; }
  .node.is-sel .n-body {
    transform: translateY(-2px) scale(1.02);
    background: linear-gradient(180deg, var(--surface), color-mix(in oklch, var(--node-c, var(--c-current)) 7%, var(--surface)));
    box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--node-c, var(--c-current)) 62%, var(--border)),
                0 0 0 2px color-mix(in oklch, var(--node-c, var(--c-current)) 22%, transparent),
                var(--lift-2);
  }
  .node.is-sel .n-glow { opacity: 1; }
  .node.is-sel .n-stack { transform: translate(11px, 11px); }
  .node.is-sel .n-stack.b { transform: translate(6px, 6px); }
  .node.is-sel:hover .n-body { transform: translateY(-4px) scale(1.02); }
  /* focus lives one level deeper — the node stays selected and gains an outer ring */
  .node.has-focus .n-body { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--node-c, var(--c-current)) 62%, var(--border)),
                0 0 0 2px color-mix(in oklch, var(--node-c, var(--c-current)) 22%, transparent),
                0 0 0 6px color-mix(in oklch, var(--node-c, var(--c-current)) 11%, transparent),
                var(--lift-2); }

  /* de-emphasis by depth, never by lowering text contrast */
  .world.has-focus .node:not(.is-sel) .n-body { box-shadow: var(--edge-recessed); background: var(--flat); }
  .world.has-focus .node:not(.is-sel) .n-stack { opacity: 0; }

  /* ─── floating drawer ─────────────────────────────────────────────── */
  .dock {
    position: absolute; top: 16px; right: 16px; bottom: 16px; width: var(--dock-w);
    display: flex; flex-direction: column; min-height: 0; z-index: 12;
    background: color-mix(in oklch, var(--surface) 92%, transparent);
    backdrop-filter: blur(18px);
    border-radius: var(--r-xl);
    box-shadow: inset 0 0 0 1px oklch(0 0 0 / 0.05), var(--lift-2);
    transition: box-shadow var(--t-slow) var(--ease-out);
  }
  .dock.active { box-shadow: inset 0 0 0 1px oklch(0 0 0 / 0.075), var(--lift-3); }
  .dock-view { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; border-radius: var(--r-xl); }

  .pane {
    position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0;
    background: transparent;
  }
  .pane-body { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .grow { flex: 1 1 auto; min-width: 0; }
  .pane.in-push, .pane.in-pop { z-index: 2; }
  .pane.anim { transition: transform var(--t-base) var(--ease-out), opacity var(--t-base) ease; }
  .pane.anim-spring { transition: transform var(--t-slow) var(--ease-spring), opacity var(--t-base) ease; }
  .pane.out { z-index: 1; pointer-events: none; transition-duration: 160ms; }

  .dnav {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 14px;
    border-bottom: 1px solid var(--border); min-height: 50px;
  }
  .dback {
    display: inline-flex; align-items: center; gap: 7px; min-width: 0; padding: 5px 9px; margin-left: -4px;
    border-radius: 999px; border: 1px solid transparent;
    font-family: var(--font-mono); font-size: 11px; color: var(--muted-ink);
    transition: color var(--t-fast), background var(--t-fast), border-color var(--t-fast);
  }
  .dback:hover { color: var(--fg); background: var(--fg-soft); border-color: var(--border); }
  .dback .arw { transition: transform var(--t-base) var(--ease-out); }
  .dback:hover .arw { transform: translateX(-2px); }
  .dback span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dnav .kicker { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-ink); }
  .dnav .grow { flex: 1 1 auto; }
  .iconbtn {
    position: relative;
    width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; flex: 0 0 auto;
    border: 1px solid var(--border); color: var(--muted-ink); font-size: 13px; line-height: 1;
    transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast), transform var(--t-fast), scale var(--t-fast) var(--ease-out);
  }
  .iconbtn:hover { border-color: var(--border-strong); color: var(--fg); background: var(--fg-soft); transform: scale(1.05); }
  .iconbtn:active { scale: .96; }
  .iconbtn::after { content: ''; position: absolute; inset: -5px; }

  .dscroll { position: relative; flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 16px 18px 22px; }

  .dhead .meta { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
  .ord { font-family: var(--font-mono); font-size: 11px; color: var(--muted-ink); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; }
  .tchip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .04em; color: var(--ink-done); }
  .tchip.parallel { color: var(--ink-parallel); }
  .tchip.shift { color: var(--ink-shift); }
  .tchip.current { color: var(--ink-current); }
  .tchip.unknown { color: var(--muted-ink); }
  .dhead h2 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 600; line-height: 1.2; letter-spacing: -.014em; }
  .data-badge { display: inline-flex; align-items: center; width: fit-content; margin-top: 7px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 4px; color: var(--muted-ink); font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .04em; }
  .statuschip { display: inline-flex; align-items: center; gap: 7px; margin-top: 10px; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted-ink); }
  .statuschip.current { color: var(--ink-current); }

  .sec { padding-top: 17px; }
  .sec + .sec { border-top: 1px solid var(--border); margin-top: 17px; }
  .sec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
  .sec-label { margin: 0; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-ink); }
  .sec-label .zh { text-transform: none; letter-spacing: 0; }
  .outcome { margin: 9px 0 0; font-size: 14.5px; line-height: 1.55; color: var(--fg); }
  .actions { margin: 11px 0 0; padding: 0; list-style: none; }
  .actions li { position: relative; padding-left: 15px; font-size: 13px; line-height: 1.5; color: var(--fg); }
  .actions li + li { margin-top: 8px; }
  .actions li::before { content: ''; position: absolute; left: 1px; top: 8.5px; width: 5px; height: 1px; background: var(--border-strong); }

  .evchip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid color-mix(in oklch, var(--c-evidence) 30%, var(--border));
    background: color-mix(in oklch, var(--c-evidence) 8%, transparent);
    font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-evidence); white-space: nowrap;
    transition: transform var(--t-fast) var(--ease-out), background var(--t-fast), border-color var(--t-fast);
  }
  .evchip:hover { transform: translateY(-1px); background: color-mix(in oklch, var(--c-evidence) 14%, transparent); border-color: color-mix(in oklch, var(--c-evidence) 46%, var(--border)); }
  .evchip::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--c-evidence); }
  .evchip .car { font-size: 11px; transition: transform var(--t-base) var(--ease-out); }
  .evchip[aria-expanded="true"] .car { transform: rotate(90deg); }

  /* evidence attached to the claim — expands in place with a real height transition */
  .evpeek {
    height: 0; overflow: hidden; opacity: 0; visibility: hidden;
    transition: height var(--t-base) var(--ease-out), opacity 200ms ease, visibility 0s linear var(--t-base);
  }
  .evpeek.open { visibility: visible; transition: height var(--t-base) var(--ease-out), opacity 200ms ease, visibility 0s; }
  .evpeek .plabel { margin: 12px 0 0; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-evidence); }
  .peek { margin: 8px 0 2px; padding: 0; list-style: none; }
  .peek li + li { margin-top: 5px; }
  .peekrow {
    display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border-radius: var(--r-lg);
    border: 1px dashed color-mix(in oklch, var(--c-evidence) 32%, var(--border));
    background: color-mix(in oklch, var(--c-evidence) 5%, transparent);
    transition: transform var(--t-fast) var(--ease-out), border-color var(--t-fast), background var(--t-fast);
  }
  .peekrow:hover { transform: translateX(2px); border-style: solid; background: color-mix(in oklch, var(--c-evidence) 10%, transparent); }
  .peekrow .t { flex: 1 1 auto; min-width: 0; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .peekrow .go { font-family: var(--font-mono); font-size: 11px; color: var(--muted-ink); flex: 0 0 auto; }

  .subs { margin: 11px 0 0; padding: 0; list-style: none; }
  .subs li + li { margin-top: 6px; }
  .subrow {
    display: flex; align-items: center; gap: 11px; width: 100%; padding: 11px 12px;
    border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--edge);
    transition: transform var(--t-fast) var(--ease-out), box-shadow var(--t-fast);
  }

    },

  const SUBS = PRC_DATA.subs || DEMO_SUBS;
  const RUN = PRC_DATA.run || {};

  const fmtName = function (id) { return isAggregate(id) ? NODES[id].name + ' ×' + SUBS[id].length : NODES[id].name; };

      segs + progs + (TOP.length > 1
        ? '<path class="flow" d="' + spinePath(WORLDS[TOP[TOP.length - 2]], WORLDS[TOP[TOP.length - 1]]) + '"/>'

    let html = svg;

    TOP.forEach(function (id, i) {
      const w = WORLDS[id];
      html += '<span class="stop' + (NODES[id].status === 'current' ? ' is-cur' : '') + '" data-stop="' + id + '" style="left:' + (w.railX - 10) + 'px;top:' + (w.cy - 10) + 'px">' + (i + 1) + '</span>';

    });

    el.world.style.width = WORLD_W + 'px';
    el.world.style.height = WORLD_H + 'px';
    el.world.innerHTML = html;

    Array.prototype.forEach.call(el.world.querySelectorAll('path.seg, path.prog'), function (p) {
      const len = Math.ceil(p.getTotalLength()) + 1;
      p.style.strokeDasharray = len;
      if (p.classList.contains('prog')) p.style.strokeDashoffset = len;
    });
  }

  function nodeHTML(id) {
    const n = NODES[id], w = WORLDS[id];
    const tc = TYPE_CLASS[n.type];
    const stack = isAggregate(id) ? '<span class="n-stack"></span><span class="n-stack b"></span>' : '';
    const statusText = STATUS_TEXT[n.status] + (n.type === 'parallel' ? ' · 并行分支' : n.type === 'shift' ? ' · 方向修正' : '');
    return '<button type="button" class="node" data-node="' + id + '" data-od-id="node-' + id + '" aria-pressed="false" ' +
      'style="left:' + w.x + 'px;top:' + w.y + 'px;width:' + CARD_W + 'px;height:' + CARD_H + 'px;--node-c:var(--c-' + tc + ')">' +
      '<span class="n-glow"></span>' + stack +
      '<span class="n-body">' +
      '<span class="n-name">' + esc(fmtName(id)) + '</span>' +
      '<span class="n-out">' + esc(n.outcome) + '</span>' +
      '<span class="n-status"><i class="glyph ' + tc + '"></i>' + statusText + '</span>' +
      '</span></button>';
  }

  /* ── viewport: transform = userOverride ?? fit(layout, size) ──────── */
  const view = { x: 0, y: 0, z: 1 };
  let override = null, tween = null;
  const ZMIN = 0.45, ZMAX = 1.9;

  function fitRect() {
    const desktop = window.matchMedia('(min-width: 901px)').matches;
    const dockW = desktop ? el.dock.offsetWidth + 16 + 26 : 0;
    return { left: 24, top: 56, right: dockW + 24, bottom: desktop ? 20 : 12 };
  }
  function fitView() {
    const r = fitRect();
    const bw = Math.max(80, el.canvas.clientWidth - r.left - r.right);
    const bh = Math.max(80, el.canvas.clientHeight - r.top - r.bottom);
    const z = Math.max(ZMIN, Math.min(bw / WORLD_W, bh / WORLD_H, 1));
    return { z: z, x: r.left + (bw - WORLD_W * z) / 2, y: r.top + (bh - WORLD_H * z) / 2 };
  }
  function applyView() {
    const v = override || fitView();
    view.x = v.x; view.y = v.y; view.z = v.z;
    el.world.style.transform = 'translate(' + v.x + 'px,' + v.y + 'px) scale(' + v.z + ')';
    el.zoomVal.textContent = Math.round(v.z * 100) + '%';
  }
  function glideTo(target, dur) {
    const from = { x: view.x, y: view.y, z: view.z }, t0 = performance.now();
    if (tween) cancelAnimationFrame(tween);
    (function step(now) {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      override = { x: from.x + (target.x - from.x) * e, y: from.y + (target.y - from.y) * e, z: from.z + (target.z - from.z) * e };
      applyView();
      if (p < 1) tween = requestAnimationFrame(step); else tween = null;
    })(t0);
  }
  function zoomBy(factor, cx, cy) {
    const base = override || { x: view.x, y: view.y, z: view.z };
    const z = Math.max(ZMIN, Math.min(ZMAX, base.z * factor)), k = z / base.z;
    override = { z: z, x: cx - (cx - base.x) * k, y: cy - (cy - base.y) * k };
    applyView();
  }

  /* ── drawer navigation stack ──────────────────────────────────────── */
  function push(entry) { state.stack.push(entry); render('push'); }
  function pop() { if (state.stack.length > 1) { state.stack.pop(); render('pop'); } else { clearAll(); } }
  function clearAll() { state.stack = []; render('none'); }

  function selectStage(id) {
    const same = state.stack.length === 1 && state.stack[0].id === id;
    state.stack = same ? [] : [{ lvl: 1, id: id }];
    render(same ? 'pop' : 'push');
  }

  function paneHTML() {
    const cur = top();
    if (!cur) return railHTML();
    if (cur.lvl === 4) return rawHTML();
    if (cur.lvl === 3) return evidenceHTML();
    return stageHTML(cur.id, cur.lvl === 2);
  }

  function navHTML(backLabel) {
    return '<header class="dnav">' +
      (backLabel
        ? '<button type="button" class="dback" data-back><span class="arw">←</span><span>' + esc(backLabel) + '</span></button>'
        : '<span class="kicker">RUN · CODEx NATIVE RUNTIME</span>') +
      '<span class="grow"></span>' +
      '<button type="button" class="iconbtn" data-close aria-label="清除选择">✕</button>' +
      '</header>';
  }

  function stageHTML(id, isSub) {
    const n = NODES[id], tc = TYPE_CLASS[n.type];
    const back = isSub ? fmtName(n.parent) : null;
    const subs = (!isSub && isAggregate(id)) ? subsHTML(id) : '';
    const ev = n.evidence.length;
    return '<div class="pane-body">' + navHTML(back) + '<div class="dscroll">' +
      '<div class="dhead">' +
        '<div class="meta"><span class="ord">' + n.ord + '</span>' +
          '<span class="tchip ' + tc + '"><i class="glyph ' + tc + '"></i>' + TYPE_TEXT[n.type] + '</span></div>' +
        '<h2>' + esc(fmtName(id)) + '</h2>' +
        '<span class="data-badge">DERIVED_SUMMARY · evidence-bound</span>' +
        '<span class="statuschip ' + tc + '"><i class="glyph ' + tc + '"></i>' + STATUS_TEXT[n.status] + '</span>' +
      '</div>' +
      '<section class="sec" data-sec="outcome">' +
        '<div class="sec-head"><h3 class="sec-label">Outcome <span class="zh">· 结论</span></h3><span class="grow"></span>' +
        (ev ? '<button type="button" class="evchip" data-evchip aria-expanded="false">' + ev + ' evidence <span class="car">›</span></button>' : '') + '</div>' +
        '<p class="outcome">' + esc(n.outcome) + '</p>' +
        '<p class="note"><b>语义边界</b> · 标题与说明来自显式用户请求锚点；不是 native runtime 的完成结论或因果解释。</p>' +
        (ev ? '<div class="evpeek"><p class="plabel">支持这条结论的证据</p><ul class="peek">' +
          n.evidence.map(function (e, i) {
            return '<li><button type="button" class="peekrow" data-ev="' + i + '">' +
              '<span class="t">' + esc(e.title) + '</span><span class="go">进入 →</span></button></li>';
          }).join('') + '</ul></div>' : '') +
      '</section>' +
      (n.actions.length ? '<section class="sec"><h3 class="sec-label">Key Actions <span class="zh">· 关键动作</span></h3>' +
        '<ul class="actions">' + n.actions.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></section>' : '') +
      subs +
      (n.evidence.length
        ? '<section class="sec" data-sec="evidence"><h3 class="sec-label">Artifacts / Evidence <span class="zh">· 成果与证据</span></h3>' +
          '<ul class="ev">' + n.evidence.map(function (e, i) {
            return '<li><button type="button" class="evrow" data-ev="' + i + '">' +
              '<span class="ev-type">' + esc(e.type) + '</span>' +
              '<span class="ev-title">' + esc(e.title) + '</span>' +
              '<span class="ev-go">›</span></button></li>';
          }).join('') + '</ul></section>'
        : '<section class="sec"><h3 class="sec-label">Artifacts / Evidence <span class="zh">· 成果与证据</span></h3>' +
          '<p class="note">该子阶段的结论不在本轮 fixture 范围内，因此没有可追索的证据条目。</p></section>') +
      '<button type="button" class="rawlink" data-raw><span>查看 raw evidence / trace</span><span class="go">最深一层 →</span></button>' +
      '<p class="note"><b>DERIVED_SUMMARY</b> · 该层只提供导航性 WorkStage 标签；支持关系仍以 native runtime records 为准。</p>' +
      '</div></div>';
  }

  function subsHTML(id) {
    const list = SUBS[id];
    let h = '<section class="sec" data-sec="subs"><div class="sec-head"><h3 class="sec-label">Sub-stages <span class="zh">· 子阶段</span></h3>' +
      '<span class="grow"></span><span class="tchip parallel">' + list.length + ' 个</span></div><ul class="subs">';
    list.forEach(function (cid) {
      const c = NODES[cid], un = c.type === 'unknown';
      h += '<li><button type="button" class="subrow' + (un ? ' unresolved' : '') + '" data-sub="' + cid + '">' +
        '<span class="sub-ord">' + c.ord + '</span>' +
        '<span class="sub-main"><span class="sub-name">' + esc(c.name) + '</span>' +
        '<span class="sub-out">' + esc(c.outcome) + '</span></span>' +
        '<span class="sub-go">›</span></button></li>';
    });
    h += '</ul><p class="note">graph 始终只显示一个 aggregate 节点 —— 子阶段全部在这里逐层展开。</p></section>';
    return h;
  }

  function evidenceHTML() {
    const cur = top();
    const owner = state.stack[state.stack.length - 2];
    const n = NODES[owner.id], e = n.evidence[cur.ev];
    return '<div class="pane-body">' + navHTML(fmtName(owner.id)) + '<div class="dscroll">' +
      '<div class="dhead">' +
        '<div class="meta"><span class="ev-type-solo">' + esc(e.type) + '</span></div>' +
        '<h2>' + esc(e.title) + '</h2>' +
        '<span class="data-badge">' + esc(e.data_class || 'NATIVE_FACT') + '</span>' +
        '<span class="statuschip"><i class="glyph" style="background:var(--c-evidence)"></i>Evidence · 所属 ' + n.ord + ' ' + esc(fmtName(owner.id)) + '</span>' +
      '</div>' +
      '<section class="sec"><h3 class="sec-label">说明 <span class="zh">· Note</span></h3>' +
        '<p class="outcome">' + esc(e.note) + '</p></section>' +
      '<section class="sec"><h3 class="sec-label">证据边界 <span class="zh">· Boundary</span></h3>' +
        '<div class="sup"><span class="k">NATIVE_FACT · 可直接观察</span><span class="v">' + esc(e.supports) + '</span></div></section>' +
      '<button type="button" class="rawlink" data-raw><span>查看 raw evidence / trace</span><span class="go">最深一层 →</span></button>' +
      '<p class="note"><b>NATIVE_FACT</b> · 此条目只指向 observer 捕获的原始记录，不宣称执行成功或产生了某个结果。</p>' +
      '</div></div>';
  }

  function rawEventsForNode(id) {
    const node = NODES[id];
    return node && Array.isArray(node.raw_events) ? node.raw_events : [];
  }

  function rawField(label, value) {
    if (value === null || value === undefined || value === '') return '';
    return '<li><span class="k">' + esc(label) + '</span><span class="v mono">' + esc(value) + '</span></li>';
  }

  function rawRecordHTML(event) {
    const native = event.native_evidence || {};
    let detail = rawField('event_type', event.event_type) +
      rawField('observed_at', event.observed_at) +
      rawField('runtime_agent_instance_id', event.runtime_agent_instance_id) +
      rawField('turn_id', event.turn_id) +
      rawField('provider_item_id', event.provider_item_id) +
      rawField('observation_id', event.observation_id) +
      rawField('reconciliation', event.reconciliation);
    if (native.kind === 'command') {
      detail += rawField('command', native.command) + rawField('cwd', native.cwd) +
        rawField('status', native.status) + rawField('exit_code', native.exit_code) +
        rawField('duration_ms', native.duration_ms);
    }
    if (native.kind === 'file_change') {
      detail += rawField('change_count', native.change_count);
      (native.files || []).forEach(function (file) {
        detail += rawField('file_' + file.kind, file.path);
      });
    }
    return '<article class="rawrecord"><div class="rawrecord-head"><span class="ev-type">NATIVE_FACT</span><span class="mono">' +
      esc(event.event_type || 'unknown') + '</span></div><ul class="rawlist">' + detail +
      '</ul></article>';
  }

  function rawHTML() {
    const owner = state.stack.length > 1 && state.stack[state.stack.length - 2].id ? state.stack[state.stack.length - 2].id : level1();
    const records = rawEventsForNode(owner);
    return '<div class="pane-body">' + navHTML(owner ? fmtName(owner) : null) + '<div class="dscroll">' +
      '<div class="dhead"><div class="meta"><span class="ord">RAW</span><span class="tchip" style="color:var(--muted-ink)">最深一层</span></div>' +
      '<h2>Raw Evidence / Trace</h2>' +
      '<span class="statuschip">真实 observer records · read only</span></div>' +
      '<section class="sec"><h3 class="sec-label">Scope <span class="zh">· 范围</span></h3>' +
      '<p class="outcome">这里列出该 WorkStage 所绑定的 observer 原始记录。它们是追索终点，不是对工作结果的额外解释。</p></section>' +
      '<section class="sec"><h3 class="sec-label">Runtime records <span class="zh">· 原始记录</span></h3>' +
      (records.length ? records.map(rawRecordHTML).join('') : '<p class="note"><b>UNAVAILABLE</b> · 当前 WorkStage 没有可展示的绑定记录。</p>') + '</section>' +
      '</div></div>';
  }

  function railHTML() {
    return '<div class="pane-body"><div class="rail-empty">' +
      '<span class="kicker">RUN 概览</span>' +
      '<h2>真实 Codex Run</h2>' +
      '<p>选择一个 WorkStage，graph 不会展开、也不会移动；分辨率在右侧逐层提高。</p>' +
      '<ul class="facts">' +
      '<li><span class="k">WorkStage</span><span class="v">' + TOP.length + '</span></li>' +
      '<li><span class="k">Runtime Agent</span><span class="v">' + (RUN.agent_count ?? 'UNAVAILABLE') + '</span></li>' +
      '<li><span class="k">Children</span><span class="v">' + (RUN.child_count ?? 'UNAVAILABLE') + '</span></li>' +
      '<li><span class="k">Native events</span><span class="v">' + (RUN.event_count ?? 'UNAVAILABLE') + '</span></li>' +
      '<li><span class="k">History</span><span class="v">' + (RUN.history_available ? 'AVAILABLE' : 'UNAVAILABLE') + '</span></li>' +
      '<li><span class="k">Projection</span><span class="v">' + esc(PRC_DATA.projection ? PRC_DATA.projection.status : 'UNAVAILABLE') + '</span></li>' +
      '<li><span class="k">返回上一层</span><span class="v">Esc</span></li>' +
      '</ul>' +
      '<div class="legend">' +
      '<span><i class="glyph current"></i>当前</span><span><i class="glyph done"></i>已完成</span>' +
      '<span><i class="glyph parallel"></i>并行分支</span><span><i class="glyph shift"></i>方向修正</span>' +
      '<span><i class="glyph unknown"></i>未解析</span></div>' +
      '<p class="note"><b>边界</b> · Agent、lineage、event identity 和 Raw Trace 来自 native observer；WorkStage 标题是显式用户请求锚点的派生导航标签，完成与因果仍为 NOT ESTABLISHED。</p>' +
      '</div></div>';
  }

  /* ── render ───────────────────────────────────────────────────────── */
  let lastKey = '__init';
  function render(dir) {
    const cur = top(), key = JSON.stringify(state.stack);
    if (dir === 'none' || key === lastKey) dir = 'none';
    lastKey = key;

    const selId = level1();
    el.world.classList.toggle('has-focus', !!selId);

    Array.prototype.forEach.call(el.world.querySelectorAll('[data-node]'), function (b) {
      const id = b.getAttribute('data-node');
      const on = id === selId;
      b.classList.toggle('is-sel', on);
      b.setAttribute('aria-pressed', String(on));
      b.classList.toggle('has-focus', on && state.stack.length > 1);
    });
    Array.prototype.forEach.call(el.world.querySelectorAll('[data-stop]'), function (s) {
      s.classList.toggle('is-sel', s.getAttribute('data-stop') === selId);
    });

    /* spine progress + related-edge emphasis */
    const idx = selId ? WORLDS[selId].i : -1;
    Array.prototype.forEach.call(el.world.querySelectorAll('path.seg'), function (p) {
      const i = Number(p.getAttribute('data-seg'));
      p.classList.toggle('seg-near', idx >= 0 && (i === idx - 1 || i === idx));
    });
    Array.prototype.forEach.call(el.world.querySelectorAll('path.prog'), function (p) {
      const i = Number(p.getAttribute('data-prog')), len = Number(p.style.strokeDasharray) || 0;
      p.style.strokeDashoffset = (i < idx ? 0 : len);
      p.style.opacity = (i < idx ? .9 : 0);
    });

    renderCrumbs();
    renderDock(dir);

    el.count.textContent = 'WorkStage ' + TOP.length + ' · Agent ' + (RUN.agent_count ?? 'UNAVAILABLE') + ' · Native events ' + (RUN.event_count ?? 'UNAVAILABLE');
    el.reset.disabled = !state.stack.length && !override;
    el.dock.classList.toggle('active', !!cur);
    persist();
  }

  function renderCrumbs() {
    const l1 = level1(), l2 = state.stack.length > 1 ? top() : null;
    let h = '<button type="button" data-crumb="__run" aria-current="' + (!l1) + '">Run 概览</button>';
    if (l1) {
      h += '<span class="sep">›</span><button type="button" data-crumb="' + l1 + '"' + (l2 ? '' : ' aria-current="true"') + '>' + esc(fmtName(l1)) + '</button>';
    }
    if (l2 && l2.lvl === 2) {
      h += '<span class="sep">›</span><button type="button" data-crumb="' + l2.id + '" aria-current="true">' + esc(NODES[l2.id].name) + '</button>';
    } else if (l2 && l2.lvl === 3) {
      const owner = state.stack[state.stack.length - 2];
      h += '<span class="sep">›</span><button type="button" data-crumb="' + owner.id + '" aria-current="true">Evidence · ' + esc(NODES[owner.id].evidence[l2.ev].title) + '</button>';
    }
    el.crumbs.innerHTML = h;
  }

  function renderDock(dir) {
    const host = el.dock;
    Array.prototype.forEach.call(host.querySelectorAll('.pane.out'), function (p) { p.remove(); });
    const next = document.createElement('div');
    next.className = 'pane' + (dir === 'none' ? '' : dir === 'pop' ? ' anim in-pop' : ' anim-spring in-push');
    next.innerHTML = paneHTML();

    const prev = host.querySelector('.pane');
    if (!prev || dir === 'none') {
      host.innerHTML = '';
      host.appendChild(next);
      return;
    }
    const dx = dir === 'push' ? 34 : -34;
    next.style.transform = 'translateX(' + dx + 'px)';
    next.style.opacity = '0';
    host.appendChild(next);
    prev.classList.add('out', 'anim');
    void next.offsetWidth;
    next.style.transform = 'translateX(0)';
    next.style.opacity = '1';
    prev.style.transform = 'translateX(' + (-dx * .6) + 'px)';
    prev.style.opacity = '0';
    setTimeout(function () {
      if (prev.parentNode) prev.remove();
      if (!next.classList.contains('out')) {
        next.className = 'pane';
        next.style.transform = ''; next.style.opacity = '';
      }
    }, 440);
  }

  /* ── persistence ──────────────────────────────────────────────────── */
  function persist() {
    try { localStorage.setItem(STORE, JSON.stringify({ stack: state.stack })); } catch (e) {}
  }
  function restore() {
    let raw = null;
    try { raw = localStorage.getItem(STORE); } catch (e) { return; }
    if (!raw) return;
    try {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.stack) && s.stack.length) {
        const ok = s.stack.every(function (e) {
          return (e.lvl === 1 || e.lvl === 2) ? !!NODES[e.id] : (e.lvl === 4 || (e.lvl === 3 && typeof e.ev === 'number'));
        });
        if (ok && s.stack[0].lvl === 1) state.stack = s.stack;
      }
    } catch (e) {}
  }

  /* ── events ───────────────────────────────────────────────────────── */
  el.world.addEventListener('click', function (e) {
    const n = e.target.closest('[data-node]');
    if (n) selectStage(n.getAttribute('data-node'));
  });
  el.world.addEventListener('pointerover', function (e) {
    const n = e.target.closest('[data-node]');
    if (!n) return;
    const i = WORLDS[n.getAttribute('data-node')].i;
    Array.prototype.forEach.call(el.world.querySelectorAll('path.seg'), function (p) {
      const k = Number(p.getAttribute('data-seg'));
      p.classList.toggle('seg-near', k === i - 1 || k === i);
    });
  });
  el.world.addEventListener('pointerout', function (e) {
    if (e.relatedTarget && el.world.contains(e.relatedTarget)) return;
    const idx = level1() ? WORLDS[level1()].i : -1;
    Array.prototype.forEach.call(el.world.querySelectorAll('path.seg'), function (p) {
      const k = Number(p.getAttribute('data-seg'));
      p.classList.toggle('seg-near', idx >= 0 && (k === idx - 1 || k === idx));
    });
  });

  el.crumbs.addEventListener('click', function (e) {
    const b = e.target.closest('[data-crumb]');
    if (!b) return;
    const v = b.getAttribute('data-crumb');
    if (v === '__run') clearAll();
    else if (NODES[v] && NODES[v].parent) { state.stack = [{ lvl: 1, id: NODES[v].parent }]; render('pop'); }
    else if (NODES[v]) selectStage(v);
  });

  el.dock.addEventListener('click', function (e) {
    const chip = e.target.closest('[data-evchip]');
    if (chip) {
      const peek = el.dock.querySelector('.evpeek');
      if (peek) {
        const open = !peek.classList.contains('open');
        peek.classList.toggle('open', open);
        chip.setAttribute('aria-expanded', String(open));
        peek.style.height = open ? (peek.scrollHeight + 'px') : '0px';
        peek.style.opacity = open ? '1' : '0';
      }
      return;
    }
    const sub = e.target.closest('[data-sub]');
    if (sub) { push({ lvl: 2, id: sub.getAttribute('data-sub') }); return; }
    const ev = e.target.closest('[data-ev]');
    if (ev) { push({ lvl: 3, ev: Number(ev.getAttribute('data-ev')) }); return; }
    if (e.target.closest('[data-raw]')) { push({ lvl: 4 }); return; }
    if (e.target.closest('[data-back]')) { pop(); return; }
    if (e.target.closest('[data-close]')) { clearAll(); }
  });

  el.reset.addEventListener('click', function () {
    override = null; state.stack = []; applyView(); render('none');
  });

  document.getElementById('zoom-in').addEventListener('click', function () {
    const r = el.canvas.getBoundingClientRect();
    const base = override || fitView(), z = Math.min(ZMAX, base.z * 1.2), k = z / base.z;
    glideTo({ z: z, x: r.width / 2 - (r.width / 2 - base.x) * k, y: r.height / 2 - (r.height / 2 - base.y) * k }, 240);
  });
  document.getElementById('zoom-out').addEventListener('click', function () {
    const r = el.canvas.getBoundingClientRect();
    const base = override || fitView(), z = Math.max(ZMIN, base.z / 1.2), k = z / base.z;
    glideTo({ z: z, x: r.width / 2 - (r.width / 2 - base.x) * k, y: r.height / 2 - (r.height / 2 - base.y) * k }, 240);
  });
  document.getElementById('zoom-fit').addEventListener('click', function () {
    if (tween) cancelAnimationFrame(tween);
    override = null; applyView();
  });

  let drag = null;
  el.canvas.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 || e.target.closest('[data-node], .crumbs')) return;
    drag = { px: e.clientX, py: e.clientY, x: view.x, y: view.y };
    el.canvas.classList.add('is-panning');
    el.canvas.setPointerCapture(e.pointerId);
  });
  el.canvas.addEventListener('pointermove', function (e) {
    if (!drag) return;
    if (tween) { cancelAnimationFrame(tween); tween = null; }
    override = { z: view.z, x: drag.x + (e.clientX - drag.px), y: drag.y + (e.clientY - drag.py) };
    applyView();
  });
  function endDrag(e) {
    if (!drag) return;
    drag = null;
    el.canvas.classList.remove('is-panning');
    if (el.canvas.hasPointerCapture && el.canvas.hasPointerCapture(e.pointerId)) el.canvas.releasePointerCapture(e.pointerId);
  }
  el.canvas.addEventListener('pointerup', endDrag);
  el.canvas.addEventListener('pointercancel', endDrag);

  el.canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    const r = el.canvas.getBoundingClientRect();
    const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    zoomBy(Math.exp(-d * 0.0016), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { pop(); return; }
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const a = document.activeElement;
    if (!a || !a.hasAttribute || !a.hasAttribute('data-node')) return;
    e.preventDefault();
    const i = TOP.indexOf(a.getAttribute('data-node'));
    const nx = TOP[Math.min(TOP.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)))];
    const b = el.world.querySelector('[data-node="' + nx + '"]');
    if (b) b.focus();
  });

  let rt = null;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { if (!override) applyView(); }, 90);
  });

  /* ── boot ─────────────────────────────────────────────────────────── */
  const runIdEl = document.querySelector('[data-od-id="run-id"]');
  if (runIdEl && RUN.run_id) runIdEl.textContent = 'run · ' + RUN.run_id;
  buildWorld();
  restore();
  applyView();
  render('none');
})();
</script>
</body>
</html>

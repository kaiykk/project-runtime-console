<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Project Runtime Console</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101419;
        --panel: #171d24;
        --panel-2: #1c242d;
        --line: #2d3843;
        --text: #e7edf3;
        --muted: #93a1af;
        --cyan: #55c7d9;
        --green: #8fd694;
        --amber: #f0c674;
        --red: #ee8d8d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 1024px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      button {
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        padding: 7px 10px;
        cursor: pointer;
      }
      button:hover, button.selected { border-color: var(--cyan); color: var(--cyan); }
      .shell { display: grid; grid-template-columns: 220px 260px 1fr; min-height: 100vh; }
      aside, main { border-right: 1px solid var(--line); }
      .rail { padding: 16px; background: #0d1116; }
      .rail h1 { margin: 0 0 18px; font-size: 14px; letter-spacing: 0; }
      .rail .label, .section-title { color: var(--muted); font-size: 11px; text-transform: uppercase; }
      .project { margin-top: 8px; border-left: 2px solid var(--cyan); padding: 10px 0 10px 10px; }
      .run-item { margin-top: 12px; width: 100%; text-align: left; }
      .topology { padding: 16px; background: var(--panel); }
      .topology h2, main h2 { margin: 0; font-size: 15px; }
      .tree { margin-top: 18px; padding-left: 10px; }
      .tree-node { border-left: 1px solid var(--line); padding: 8px 0 8px 12px; }
      .tree-node.active { border-left-color: var(--cyan); color: var(--cyan); }
      .tree-node small { display: block; color: var(--muted); margin-top: 3px; }
      main { border: 0; padding: 16px 20px 40px; overflow: auto; }
      .header { display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
      .crumb { color: var(--muted); }
      .crumb strong { color: var(--text); }
      .status { color: var(--green); border: 1px solid #416447; padding: 5px 8px; }
      .trace { margin-top: 22px; }
      .event { display: grid; grid-template-columns: 90px minmax(0, 1fr) 170px; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
      .event:hover { background: rgba(85, 199, 217, .05); }
      .event.selected { background: rgba(85, 199, 217, .10); }
      .event .ordinal { color: var(--muted); }
      .event .kind { color: var(--cyan); }
      .event .tool { color: var(--text); margin-top: 4px; }
      .event .preview { color: var(--muted); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .judgment { border-left: 2px solid var(--amber); padding-left: 9px; }
      .judgment .verdict { color: var(--amber); }
      .judgment .meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
      .details { margin-top: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .panel { background: var(--panel); border: 1px solid var(--line); padding: 14px; min-height: 150px; }
      .panel h3 { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
      pre { margin: 0; white-space: pre-wrap; word-break: break-word; color: #c9d4de; }
      .ledger-row { padding: 8px 0; border-top: 1px solid var(--line); }
      .ledger-row:first-child { border-top: 0; }
      .empty { color: var(--muted); padding: 22px 0; }
      @media (max-width: 1100px) {
        body { min-width: 0; }
        .shell { grid-template-columns: 180px 220px 1fr; }
        .event { grid-template-columns: 70px minmax(0, 1fr) 140px; }
      }
    </style>
  </head>
  <body>
    <div id="app" class="shell">
      <aside class="rail">
        <h1>Project Runtime Console</h1>
        <div class="label">Project</div>
        <div id="project" class="project">Loading...</div>
        <div class="label" style="margin-top: 26px;">Run</div>
        <button id="run-button" class="run-item">Loading...</button>
      </aside>
      <aside class="topology">
        <h2>Agent Topology</h2>
        <div id="topology" class="tree"></div>
      </aside>
      <main>
        <div class="header">
          <div>
            <div class="crumb">Project / Run / <strong>Trace</strong></div>
            <h2 id="run-title" style="margin-top: 7px;">Loading...</h2>
          </div>
          <div id="run-status" class="status">OBSERVED</div>
        </div>
        <section class="trace">
          <div class="section-title">Runtime Trace · Shadow Judgment</div>
          <div id="events"></div>
        </section>
        <section class="details">
          <div class="panel">
            <h3>Selected Event</h3>
            <pre id="event-detail" class="empty">Select a trace event.</pre>
          </div>
          <div class="panel">
            <h3>Judgment Ledger</h3>
            <div id="ledger"></div>
          </div>
        </section>
      </main>
    </div>
    <script>
      const state = { value: null, selected: null };
      const byId = (id) => document.getElementById(id);
      const text = (value) => value == null ? "" : String(value);
      const preview = (value) => text(value).replace(/\s+/g, " ").slice(0, 120);

      function render() {
        const data = state.value;
        if (!data) return;
        byId("project").textContent = data.project.name;
        byId("run-button").textContent = data.run.id.slice(0, 26);
        byId("run-title").textContent = `Run ${data.run.id}`;
        byId("run-status").textContent = data.run.status;
        byId("topology").innerHTML = data.agents.map(agent => `
          <div class="tree-node active">
            ${agent.label}
            <small>${agent.status} · ${agent.relation_status}</small>
          </div>
        `).join("");
        const judgmentMap = new Map(data.judgments.map(j => [j.canonical_event_id, j]));
        byId("events").innerHTML = data.events.map((event, index) => {
          const judgment = judgmentMap.get(event.event_id);
          const selected = state.selected === event.event_id ? " selected" : "";
          return `
            <button class="event${selected}" data-event-id="${event.event_id}">
              <div class="ordinal">#${text(event.source_ordinal)}</div>
              <div>
                <div class="kind">${event.event_type}</div>
                <div class="tool">${text(event.tool_name) || "tool unknown"}</div>
                <div class="preview">${preview(event.tool_output)}</div>
              </div>
              <div class="judgment">
                <div class="verdict">${judgment ? judgment.verdict : "NO JUDGMENT"}</div>
                <div class="meta">${judgment ? `${judgment.mode} · ${judgment.judge_provider}` : "unjudged"}</div>
              </div>
            </button>
          `;
        }).join("") || '<div class="empty">No correlated tool-result events.</div>';
        document.querySelectorAll("[data-event-id]").forEach(button => {
          button.addEventListener("click", () => {
            state.selected = button.dataset.eventId;
            render();
          });
        });
        const selectedEvent = data.events.find(event => event.event_id === state.selected) || data.events[0];
        const selectedJudgment = selectedEvent && judgmentMap.get(selectedEvent.event_id);
        byId("event-detail").textContent = selectedEvent ? JSON.stringify({
          canonical_event_id: selectedEvent.event_id,
          source: selectedEvent.source,
          tool: selectedEvent.tool_name,
          correlation: selectedEvent.correlation_state,
          shadow_judgment: selectedJudgment
        }, null, 2) : "Select a trace event.";
        byId("ledger").innerHTML = data.judgments.map(judgment => `
          <div class="ledger-row">
            <div style="color: var(--amber)">${judgment.verdict}</div>
            <div>${judgment.decision_point} · ${judgment.mode}</div>
            <div style="color: var(--muted)">${judgment.judge_provider} / ${judgment.judge_model}</div>
          </div>
        `).join("") || '<div class="empty">No judgments.</div>';
      }

      fetch("/api/state").then(response => response.json()).then(data => {
        state.value = data;
        state.selected = data.events[0] && data.events[0].event_id;
        render();
      }).catch(error => {
        byId("events").textContent = `无法读取 demo state: ${error}`;
      });
    </script>
  </body>
</html>
